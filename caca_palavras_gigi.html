<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caça Palavras Misterioso 🥰</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #fff0f6, #fce4ec, #fff8fb);
    color: #5a3144;
    display: flex;
    justify-content: center;
    padding: 30px 15px;
  }
  .container {
    width: min(900px, 100%);
    background: rgba(255,255,255,.88);
    border-radius: 28px;
    padding: 30px;
    box-shadow: 0 15px 45px rgba(128,55,85,.16);
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 44px); }
  .subtitle { margin: 0 auto 24px; color: #8c6172; }
  .game {
    display: flex;
    gap: 28px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    gap: 4px;
    width: min(650px, 92vw);
    aspect-ratio: 1;
    user-select: none;
    touch-action: none;
  }
  .cell {
    border: 0;
    border-radius: 8px;
    background: #fff;
    color: #733f55;
    font-weight: 700;
    font-size: clamp(11px, 2.2vw, 19px);
    cursor: pointer;
    box-shadow: 0 2px 7px rgba(120,60,90,.10);
    transition: .15s;
  }
  .cell:hover { transform: scale(1.05); background: #fff1f6; }
  .cell.selected { background: #f7a8c4; color: white; transform: scale(1.04); }
  .cell.found { background: #d77fa4; color: white; }
  .words {
    min-width: 220px;
    text-align: left;
    background: #fff7fa;
    border-radius: 20px;
    padding: 20px;
  }
  .words h2 { margin-top: 0; text-align:center; font-size: 21px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    padding: 6px 10px;
    margin: 4px 0;
    border-radius: 10px;
    font-size: 14px;
    transition: .25s;
  }
  li.done { text-decoration: line-through; color: #b06c89; background: #fbe0ea; }
  .counter { margin-top: 18px; font-weight: 700; }
  .hint { font-size: 13px; color:#9b7483; margin-top: 15px; }
  #message {
    display:none;
    margin-top: 28px;
    padding: 24px;
    border-radius: 20px;
    background: linear-gradient(135deg,#ffe0ec,#fff1f6);
    animation: pop .6s ease;
  }
  #message h2 { margin-top:0; }
  .heart { position: fixed; pointer-events:none; animation: float 4s linear forwards; }
  @keyframes pop { from { opacity:0; transform:scale(.8); } to { opacity:1; transform:scale(1); } }
  @keyframes float { from { transform:translateY(0) rotate(0); opacity:1; } to { transform:translateY(-100vh) rotate(360deg); opacity:0; } }
</style>
</head>
<body>
<div class="container">
  <h1>Caça Palavras Misterioso 🥰</h1>
  <p class="subtitle">Caça Palavras Misterioso 🥰</p>

  <div class="game">
    <div id="grid" aria-label="Caça-palavras"></div>

    <div class="words">
      <h2>💗 Encontre:</h2>
      <ul id="wordList"></ul>
      <div class="counter" id="counter">0 de 10 encontradas</div>
      <div class="hint">Dica: clique na primeira letra e depois na última. ✨</div>
    </div>
  </div>

  <div id="message">
    <h2>💖 Você encontrou todas!</h2>
    <p>Pra deixar seu dia mais feliz e você não esquecer de mim ❤️</p>
  </div>
</div>

<script>
const words = ["GIGI","SAUDADES","MONSTERROSA","LIRIO","JUSTIN","MADERO","GIOVANNO","LINDA","ESTILOSA","COMPRAS"];
const displayWords = {
  "GIGI":"GIGI",
  "SAUDADES":"SAUDADES",
  "MONSTERROSA":"MONSTER-ROSA",
  "LIRIO":"LÍRIO",
  "JUSTIN":"JUSTIN",
  "MADERO":"MADERO",
  "GIOVANNO":"GIOVANNO",
  "LINDA":"LINDA",
  "ESTILOSA":"ESTILOSA",
  "COMPRAS":"COMPRAS"
};

const size = 15;
const grid = Array.from({length:size},()=>Array(size).fill(""));
const placements = [];
const directions = [[0,1],[1,0],[1,1],[0,-1],[-1,0],[1,-1],[-1,1],[-1,-1]];

function canPlace(word,r,c,dr,dc){
  for(let i=0;i<word.length;i++){
    let nr=r+dr*i,nc=c+dc*i;
    if(nr<0||nr>=size||nc<0||nc>=size) return false;
    if(grid[nr][nc] && grid[nr][nc]!==word[i]) return false;
  }
  return true;
}
function placeWord(word){
  for(let attempt=0;attempt<5000;attempt++){
    const [dr,dc]=directions[Math.floor(Math.random()*directions.length)];
    const r=Math.floor(Math.random()*size), c=Math.floor(Math.random()*size);
    if(canPlace(word,r,c,dr,dc)){
      const cells=[];
      for(let i=0;i<word.length;i++){
        const nr=r+dr*i,nc=c+dc*i;
        grid[nr][nc]=word[i];
        cells.push(nr+","+nc);
      }
      placements.push({word,cells});
      return;
    }
  }
  placeWord(word); 
}
words.forEach(placeWord);

const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
for(let r=0;r<size;r++){
  for(let c=0;c<size;c++){
    if(!grid[r][c]) grid[r][c]=letters[Math.floor(Math.random()*letters.length)];
  }
}

const gridEl=document.getElementById("grid");
const listEl=document.getElementById("wordList");
const counterEl=document.getElementById("counter");
let start=null;
let found=new Set();

words.forEach(w=>{
  const li=document.createElement("li");
  li.id="word-"+w;
  li.textContent="♡ "+displayWords[w];
  listEl.appendChild(li);
});

for(let r=0;r<size;r++){
  for(let c=0;c<size;c++){
    const btn=document.createElement("button");
    btn.className="cell";
    btn.textContent=grid[r][c];
    btn.dataset.r=r; btn.dataset.c=c;
    btn.addEventListener("click",()=>selectCell(r,c));
    gridEl.appendChild(btn);
  }
}

function selectCell(r,c){
  if(!start){ start={r,c}; clearSelection(); markTemporary(start,{r,c}); return; }
  const end={r,c};
  const dr=Math.sign(end.r-start.r), dc=Math.sign(end.c-start.c);
  const sameLine=(start.r===end.r)||(start.c===end.c)||Math.abs(end.r-start.r)===Math.abs(end.c-start.c);
  if(!sameLine){ start=end; clearSelection(); markTemporary(start,end); return; }
  const cells=[];
  let rr=start.r,cc=start.c;
  while(true){
    cells.push(rr+","+cc);
    if(rr===end.r && cc===end.c) break;
    rr+=dr; cc+=dc;
  }
  const text=cells.map(key=>{
    const [a,b]=key.split(",").map(Number); return grid[a][b];
  }).join("");
  const reverse=text.split("").reverse().join("");
  const match=words.find(w=>w===text||w===reverse);
  clearSelection();
  if(match && !found.has(match)){
    found.add(match);
    cells.forEach(key=>{
      const [a,b]=key.split(",").map(Number);
      getCell(a,b).classList.add("found");
    });
    document.getElementById("word-"+match).classList.add("done");
    counterEl.textContent=`${found.size} de ${words.length} encontradas`;
    heartBurst();
    if(found.size===words.length) document.getElementById("message").style.display="block";
  } else {
    cells.forEach(key=>{
      const [a,b]=key.split(",").map(Number);
      getCell(a,b).classList.add("selected");
    });
    setTimeout(clearSelection,350);
  }
  start=null;
}

function getCell(r,c){ return gridEl.children[r*size+c]; }
function clearSelection(){
  document.querySelectorAll(".cell.selected").forEach(x=>x.classList.remove("selected"));
}
function markTemporary(a,b){ getCell(a.r,a.c).classList.add("selected"); }

function heartBurst(){
  for(let i=0;i<7;i++){
    const h=document.createElement("div");
    h.className="heart"; h.textContent=["💗","💕","💖","💘"][Math.floor(Math.random()*4)];
    h.style.left=(Math.random()*100)+"vw";
    h.style.bottom="10px";
    h.style.fontSize=(18+Math.random()*20)+"px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),4000);
  }
}
</script>
</body>
</html>
