<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uma coisinha pra você</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff7f4,#21191a);--card:light-dark(#fff,#302526);--text:light-dark(#2b2021,#fff5f2);--muted:light-dark(#766466,#cdbfc0);--accent:light-dark(#c65c69,#f08b98)}
*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}#app{min-height:100vh;background:var(--bg);display:grid;place-items:center;padding:24px;overflow:hidden}.card{width:min(520px,100%);min-height:620px;background:var(--card);border-radius:32px;padding:42px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 18px 60px #0002;position:relative;overflow:hidden}.glow{position:absolute;width:280px;height:280px;border-radius:50%;background:var(--accent);opacity:.09;filter:blur(30px);top:-100px;right:-80px}.heart{font-size:48px;animation:pulse 1.7s infinite;margin-bottom:20px}@keyframes pulse{50%{transform:scale(1.12)}}h1{font-size:clamp(28px,7vw,42px);margin:0 0 14px;letter-spacing:-1px}p{font-size:18px;line-height:1.6;color:var(--muted);max-width:420px;margin:0 auto 28px}.btn{border:0;border-radius:999px;padding:15px 25px;background:var(--accent);color:white;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 10px 24px #c65c6940}.hidden{display:none}.message{font-size:24px;line-height:1.45;font-weight:650;max-width:430px;animation:rise .65s ease}.small{font-size:16px;color:var(--muted);margin-top:18px;line-height:1.5}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}.dots{display:flex;gap:7px;margin:22px}.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.35}.dot.on{background:var(--accent);opacity:1}.final{font-size:29px}.signature{margin-top:28px;color:var(--accent);font-weight:700}.petal{position:absolute;top:-30px;font-size:18px;animation:fall 5s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(720px) rotate(220deg);opacity:0}}
</style></head>
<body><main id="app"><section class="card"><div class="glow"></div><div id="content"><div class="lilies" aria-hidden="true">🌷 🌷 🌷</div><div class="heart">♡</div><h1>Antes de começar seu dia...</h1><p>Eu tenho uma coisinha pra você. Não demora, prometo. 🤍</p><p>Fico ansioso toda quarta-feira pra conseguir te ver. Quando acordo, já sinto um frio na barriga, e acho que é a melhor parte do meu dia.</p><button class="btn" onclick="next()">abrir surpresa</button></div></section></main>
<script>
const steps=[
['Então...','Você já sabe tudo que eu sinto e não tem surpresa idiota que eu gaste o tempo que for fazendo que vai conseguir te mostrar isso.'],
['Mas fiz isso aqui...','Só pra falar o quanto você é importante e mostrar o tamanho da sua importância pra mim.'],
['Tem uma coisa que eu percebi...','É impressionante como qualquer momento se torna muito melhor se você tá comigo, e você tem sido o ponto fora da curva de toda a rotina corrida que a gente tem.'],
['3…',''],['2…',''],['1…',''],
['A melhor parte.','De um jeito mais leve e melhor, que é como você faz eu me sentir todos os dias que te vejo ou falo com você. Sei que eu sou emocionado e talvez não devesse fazer isso, mas eu queria mostrar o quanto você é relevante e faz eu pensar em fazer qualquer besteira só pra te agradar.'],
['Só mais uma coisa...','Espero que você tenha um bom dia. É sofrido a gente não poder viver o que sente, mas só de estar do seu lado as coisas já ficam melhores. Espero que seu dia seja tão incrível quanto você é.'],
['E pra terminar...','Sou seu fã. 🤍']
];
let i=0;function next(){const c=document.getElementById('content');if(i<steps.length){let [a,b]=steps[i++];c.innerHTML=`<div class="heart">${i>=4?'♡':'♥'}</div><div class="message">${a}</div>${b?`<div class="small">${b}</div>`:''}<div class="dots">${steps.map((_,n)=>`<span class="dot ${n<i?'on':''}"></span>`).join('')}</div>${i<steps.length?'<button class="btn" onclick="next()">continuar</button>':''}`;for(let j=0;j<5;j++){let p=document.createElement('span');p.className='petal';p.textContent='♡';p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*.7+'s';document.querySelector('.card').appendChild(p);setTimeout(()=>p.remove(),6000)}}}
</script></body></html>
